<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The prompt engineering iteration loop: define, draft, test, analyze, refine</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <radialGradient id="g1" cx=".8" cy="0" r=".7"><stop offset="0" stop-color="#F3B552" stop-opacity=".25"/><stop offset="1" stop-color="#F3B552" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#407EBF"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8A9B0"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F3B552"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="960" height="350" rx="22" fill="#17191F"/>
  <rect width="960" height="350" rx="22" fill="url(#dots)"/>
  <rect width="960" height="350" rx="22" fill="url(#g1)"/>

  <text x="36" y="48" fill="#F4F1EA" font-size="24" font-weight="800" letter-spacing="-.4">The Iteration Loop</text>
  <text x="36" y="70" fill="#A8A9B0" font-size="13.5">Your first prompt is a hypothesis. Measure, learn, change one thing, repeat.</text>

  <g filter="url(#sh)">
    <rect x="36" y="92" width="164" height="112" rx="16" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".5"/>
    <rect x="218" y="92" width="164" height="112" rx="16" fill="#22252D" stroke="#82B7EC" stroke-opacity=".5"/>
    <rect x="400" y="92" width="164" height="112" rx="16" fill="#22252D" stroke="#9FC3EA" stroke-opacity=".55"/>
    <rect x="582" y="92" width="164" height="112" rx="16" fill="#22252D" stroke="#E5A33F" stroke-opacity=".55"/>
    <rect x="764" y="92" width="164" height="112" rx="16" fill="#22252D" stroke="#F3B552" stroke-opacity=".55"/>
  </g>
  <g font-size="12" font-weight="800" text-anchor="middle" fill="#17191F">
    <circle cx="60" cy="118" r="12" fill="#6AA6E3"/><text x="60" y="122">1</text>
    <circle cx="242" cy="118" r="12" fill="#82B7EC"/><text x="242" y="122">2</text>
    <circle cx="424" cy="118" r="12" fill="#9FC3EA"/><text x="424" y="122">3</text>
    <circle cx="606" cy="118" r="12" fill="#E5A33F"/><text x="606" y="122">4</text>
    <circle cx="788" cy="118" r="12" fill="#F3B552"/><text x="788" y="122">5</text>
  </g>
  <g font-size="18"><text x="168" y="125">🎯</text><text x="350" y="125">✍️</text><text x="532" y="125">🧪</text><text x="714" y="125">🔍</text><text x="896" y="125">🔧</text></g>
  <g fill="#F4F1EA" font-size="16" font-weight="800">
    <text x="52" y="158">Define</text><text x="234" y="158">Draft</text><text x="416" y="158">Test</text><text x="598" y="158">Analyze</text><text x="780" y="158">Refine</text>
  </g>
  <g fill="#A8A9B0" font-size="12">
    <text x="52" y="178">goal + success</text><text x="52" y="194">criteria</text>
    <text x="234" y="178">first prompt</text><text x="234" y="194">version (v1)</text>
    <text x="416" y="178">run on a real</text><text x="416" y="194">test set</text>
    <text x="598" y="178">read failures,</text><text x="598" y="194">find the top cause</text>
    <text x="780" y="178">change one thing,</text><text x="780" y="194">then re-test</text>
  </g>
  <g stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)">
    <line x1="201" y1="148" x2="214" y2="148"/><line x1="383" y1="148" x2="396" y2="148"/><line x1="565" y1="148" x2="578" y2="148"/><line x1="747" y1="148" x2="760" y2="148"/>
  </g>
  <path d="M846 206 L846 246 L482 246 L482 210" fill="none" stroke="#F3B552" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#c)"/>
  <rect x="560" y="233" width="210" height="26" rx="13" fill="#17191F" stroke="#F3B552" stroke-opacity=".5"/>
  <text x="665" y="250" fill="#F3B552" font-size="12" font-weight="600" text-anchor="middle">same test set, every time</text>

  <!-- Score chart -->
  <text x="36" y="246" fill="#C9C7C2" font-size="12.5" font-weight="700">Eval score by version</text>
  <line x1="36" y1="322" x2="290" y2="322" stroke="#ffffff" stroke-opacity=".15"/>
  <g>
    <rect x="44" y="286.5" width="44" height="35.5" rx="6" fill="url(#bar)" opacity=".55"/>
    <rect x="104" y="281" width="44" height="41" rx="6" fill="url(#bar)" opacity=".7"/>
    <rect x="164" y="277.5" width="44" height="44.5" rx="6" fill="url(#bar)" opacity=".85"/>
    <rect x="224" y="275" width="44" height="47" rx="6" fill="url(#bar)"/>
  </g>
  <g font-size="11.5" font-weight="700" fill="#F4F1EA" text-anchor="middle">
    <text x="66" y="281">71%</text><text x="126" y="275">82%</text><text x="186" y="271">89%</text><text x="246" y="269" fill="#6CC79A">94%</text>
  </g>
  <g font-size="11" fill="#A8A9B0" text-anchor="middle">
    <text x="66" y="338">v1</text><text x="126" y="338">v2</text><text x="186" y="338">v3</text><text x="246" y="338">v4</text>
  </g>
</svg>