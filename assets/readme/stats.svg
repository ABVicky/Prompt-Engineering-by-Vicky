<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title>18 modules, 60 prompt templates, 60+ exercises, 40 exam questions, about 48 hours of learning</title>
  <defs>
