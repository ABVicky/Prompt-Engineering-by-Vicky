    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7AE2E" stop-opacity=".6"/><stop offset="1" stop-color="#5AA2F5" stop-opacity=".35"/></linearGradient>
  </defs>
  <g>
    <g transform="translate(0 10)">
      <rect x=".5" y=".5" width="243" height="129" rx="20" fill="#16181D" stroke="url(#edge)"/>
      <text x="26" y="70" font-size="48" font-weight="800" fill="url(#num)">18</text>
      <text x="26" y="104" font-size="18" fill="#BFC0C8">modules in 4 stages</text>
    </g>
    <g transform="translate(259 10)">
      <rect x=".5" y=".5" width="243" height="129" rx="20" fill="#16181D" stroke="url(#edge)"/>
      <text x="26" y="70" font-size="48" font-weight="800" fill="url(#num)">60</text>
      <text x="26" y="104" font-size="18" fill="#BFC0C8">prompt templates</text>
    </g>
    <g transform="translate(518 10)">
      <rect x=".5" y=".5" width="243" height="129" rx="20" fill="#16181D" stroke="url(#edge)"/>
      <text x="26" y="70" font-size="48" font-weight="800" fill="url(#num)">60+</text>
      <text x="26" y="104" font-size="18" fill="#BFC0C8">hands-on exercises</text>
    </g>
    <g transform="translate(777 10)">
      <rect x=".5" y=".5" width="243" height="129" rx="20" fill="#16181D" stroke="url(#edge)"/>
      <text x="26" y="70" font-size="48" font-weight="800" fill="url(#num)">40</text>
      <text x="26" y="104" font-size="18" fill="#BFC0C8">exam questions + 5 tasks</text>
    </g>
    <g transform="translate(1036 10)">
      <rect x=".5" y=".5" width="243" height="129" rx="20" fill="#16181D" stroke="url(#edge)"/>
      <text x="26" y="70" font-size="48" font-weight="800" fill="url(#num)">~48 h</text>
      <text x="26" y="104" font-size="18" fill="#BFC0C8">of guided learning</text>
