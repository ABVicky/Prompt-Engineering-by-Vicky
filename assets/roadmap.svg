    <circle cx="116" cy="134" r="33" fill="none" stroke="#6AA6E3" stroke-opacity=".35"/><circle cx="116" cy="134" r="24" fill="url(#s1)"/><text x="116" y="140" fill="#F4F1EA">1</text>
    <circle cx="302" cy="134" r="33" fill="none" stroke="#9FC3EA" stroke-opacity=".35"/><circle cx="302" cy="134" r="24" fill="url(#s2)"/><text x="302" y="140" fill="#17191F">2</text>
    <circle cx="488" cy="134" r="33" fill="none" stroke="#F3B552" stroke-opacity=".35"/><circle cx="488" cy="134" r="24" fill="url(#s3)"/><text x="488" y="140" fill="#17191F">3</text>
    <circle cx="674" cy="134" r="33" fill="none" stroke="#F3B552" stroke-opacity=".35"/><circle cx="674" cy="134" r="24" fill="url(#s4)"/><text x="674" y="140" fill="#17191F">4</text>
    <circle cx="860" cy="134" r="33" fill="none" stroke="#E5A33F" stroke-opacity=".35"/><circle cx="860" cy="134" r="24" fill="url(#s5)"/><text x="860" y="141" fill="#17191F">★</text>
