    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E5A33F"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3B552"/><stop offset="1" stop-color="#E5A33F"/></linearGradient>
