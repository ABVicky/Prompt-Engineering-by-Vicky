    <text x="418" y="238" fill="#F4F1EA" font-size="17" font-weight="800">Advanced</text>
    <text x="418" y="258" fill="#A8A9B0" font-size="12">Modules 10–14</text>
    <g fill="#C9C7C2" font-size="12.5"><text x="418" y="286">• Tools &amp; agents</text><text x="418" y="306">• Multimodal &amp; APIs</text><text x="418" y="326">• Evals &amp; security</text></g>
