    <radialGradient id="g2" cx="0" cy="1" r=".6"><stop offset="0" stop-color="#407EBF" stop-opacity=".22"/><stop offset="1" stop-color="#407EBF" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#407EBF"/><stop offset=".3" stop-color="#6AA6E3"/><stop offset=".6" stop-color="#E5A33F"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#407EBF"/><stop offset="1" stop-color="#6AA6E3"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B96D6"/><stop offset="1" stop-color="#9FC3EA"/></linearGradient>
