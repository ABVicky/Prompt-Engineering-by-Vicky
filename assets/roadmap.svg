<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Course roadmap: Foundations, Intermediate, Advanced, Pro, Capstone</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/></pattern>
    <radialGradient id="g1" cx=".85" cy="0" r=".7"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0" cy="1" r=".6"><stop offset="0" stop-color="#06b6d4" stop-opacity=".22"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset=".3" stop-color="#3b82f6"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset=".8" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  </defs>
  <rect width="960" height="380" rx="22" fill="#0b1024"/>
  <rect width="960" height="380" rx="22" fill="url(#dots)"/>
  <rect width="960" height="380" rx="22" fill="url(#g1)"/>
  <rect width="960" height="380" rx="22" fill="url(#g2)"/>

  <text x="36" y="52" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-.4">Your Roadmap: Zero → Pro</text>
  <text x="36" y="76" fill="#94a0c6" font-size="13.5">18 modules · 4 stages · capstone projects · by Vicky Prasad Mahato (abvicky.in)</text>

  <line x1="116" y1="134" x2="860" y2="134" stroke="url(#line)" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  <line x1="116" y1="134" x2="860" y2="134" stroke="url(#line)" stroke-width="18" stroke-linecap="round" opacity=".15"/>

  <!-- Nodes -->
  <g font-weight="800" font-size="17" text-anchor="middle" fill="#ffffff">
    <circle cx="116" cy="134" r="33" fill="none" stroke="#10b981" stroke-opacity=".35"/><circle cx="116" cy="134" r="24" fill="url(#s1)"/><text x="116" y="140">1</text>
    <circle cx="302" cy="134" r="33" fill="none" stroke="#3b82f6" stroke-opacity=".35"/><circle cx="302" cy="134" r="24" fill="url(#s2)"/><text x="302" y="140">2</text>
    <circle cx="488" cy="134" r="33" fill="none" stroke="#8b5cf6" stroke-opacity=".35"/><circle cx="488" cy="134" r="24" fill="url(#s3)"/><text x="488" y="140">3</text>
    <circle cx="674" cy="134" r="33" fill="none" stroke="#f59e0b" stroke-opacity=".35"/><circle cx="674" cy="134" r="24" fill="url(#s4)"/><text x="674" y="140">4</text>
    <circle cx="860" cy="134" r="33" fill="none" stroke="#ec4899" stroke-opacity=".35"/><circle cx="860" cy="134" r="24" fill="url(#s5)"/><text x="860" y="141">★</text>
  </g>

  <!-- Cards -->
  <g>
    <rect x="30" y="184" width="172" height="166" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#10b981" stroke-opacity=".4"/>
    <rect x="30" y="184" width="172" height="4" rx="2" fill="url(#s1)"/>
    <text x="46" y="214" fill="#34d399" font-size="11" font-weight="800" letter-spacing="1.4">STAGE 1</text>
    <text x="46" y="238" fill="#ffffff" font-size="17" font-weight="800">Foundations</text>
    <text x="46" y="258" fill="#94a0c6" font-size="12">Modules 00–04</text>
    <g fill="#cdd3ee" font-size="12.5"><text x="46" y="286">• How LLMs work</text><text x="46" y="306">• Prompt anatomy</text><text x="46" y="326">• Principles &amp; shots</text></g>
  </g>
  <g>
    <rect x="216" y="184" width="172" height="166" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#3b82f6" stroke-opacity=".45"/>
    <rect x="216" y="184" width="172" height="4" rx="2" fill="url(#s2)"/>
    <text x="232" y="214" fill="#60a5fa" font-size="11" font-weight="800" letter-spacing="1.4">STAGE 2</text>
    <text x="232" y="238" fill="#ffffff" font-size="17" font-weight="800">Intermediate</text>
    <text x="232" y="258" fill="#94a0c6" font-size="12">Modules 05–09</text>
    <g fill="#cdd3ee" font-size="12.5"><text x="232" y="286">• Reasoning (CoT)</text><text x="232" y="306">• JSON &amp; XML output</text><text x="232" y="326">• Chains &amp; RAG</text></g>
  </g>
  <g>
    <rect x="402" y="184" width="172" height="166" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#8b5cf6" stroke-opacity=".5"/>
    <rect x="402" y="184" width="172" height="4" rx="2" fill="url(#s3)"/>
    <text x="418" y="214" fill="#c4b5fd" font-size="11" font-weight="800" letter-spacing="1.4">STAGE 3</text>
    <text x="418" y="238" fill="#ffffff" font-size="17" font-weight="800">Advanced</text>
    <text x="418" y="258" fill="#94a0c6" font-size="12">Modules 10–14</text>
    <g fill="#cdd3ee" font-size="12.5"><text x="418" y="286">• Tools &amp; agents</text><text x="418" y="306">• Multimodal &amp; APIs</text><text x="418" y="326">• Evals &amp; security</text></g>
  </g>
  <g>
    <rect x="588" y="184" width="172" height="166" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#f59e0b" stroke-opacity=".45"/>
    <rect x="588" y="184" width="172" height="4" rx="2" fill="url(#s4)"/>
    <text x="604" y="214" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1.4">STAGE 4</text>
    <text x="604" y="238" fill="#ffffff" font-size="17" font-weight="800">Pro</text>
    <text x="604" y="258" fill="#94a0c6" font-size="12">Modules 15–17</text>
    <g fill="#cdd3ee" font-size="12.5"><text x="604" y="286">• PromptOps</text><text x="604" y="306">• Domain playbooks</text><text x="604" y="326">• Career &amp; portfolio</text></g>
  </g>
  <g>
    <rect x="774" y="184" width="156" height="166" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#ec4899" stroke-opacity=".45"/>
    <rect x="774" y="184" width="156" height="4" rx="2" fill="url(#s5)"/>
    <text x="790" y="214" fill="#f9a8d4" font-size="11" font-weight="800" letter-spacing="1.4">FINISH</text>
    <text x="790" y="238" fill="#ffffff" font-size="17" font-weight="800">Capstone</text>
    <text x="790" y="258" fill="#94a0c6" font-size="12">Appendices D–E</text>
    <g fill="#cdd3ee" font-size="12.5"><text x="790" y="286">• Final exam</text><text x="790" y="306">• 6 projects</text><text x="790" y="326">• Portfolio write-up</text></g>
  </g>
</svg>
