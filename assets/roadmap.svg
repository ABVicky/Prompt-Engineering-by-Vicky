    <text x="790" y="214" fill="#F3B552" font-size="11" font-weight="800" letter-spacing="1.4">FINISH</text>
    <text x="790" y="238" fill="#F4F1EA" font-size="17" font-weight="800">Capstone</text>
    <text x="790" y="258" fill="#A8A9B0" font-size="12">Appendices D–E</text>
    <g fill="#C9C7C2" font-size="12.5"><text x="790" y="286">• Final exam</text><text x="790" y="306">• 6 projects</text><text x="790" y="326">• Portfolio write-up</text></g>
