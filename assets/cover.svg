<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Prompt Engineering: Zero to Pro, by Vicky Prasad Mahato</title>
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F3B552" stop-opacity=".35"/><stop offset="1" stop-color="#F3B552" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#407EBF" stop-opacity=".35"/><stop offset="1" stop-color="#407EBF" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#407EBF"/><stop offset=".5" stop-color="#6AA6E3"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <radialGradient id="orbShine" cx="0.35" cy="0.3" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6AA6E3" stop-opacity=".7"/><stop offset=".5" stop-color="#E5A33F" stop-opacity=".35"/><stop offset="1" stop-color="#F3B552" stop-opacity=".7"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6AA6E3"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <circle cx="470" cy="240" r="210" fill="url(#glowA)"/>
  <circle cx="170" cy="300" r="190" fill="url(#glowB)"/>

  <!-- Prompt window -->
  <g filter="url(#shadow)">
    <rect x="24" y="58" width="350" height="238" rx="20" fill="#22252D" fill-opacity=".96" stroke="url(#edge)" stroke-width="1.5"/>
    <path d="M24 98h350" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="48" cy="78" r="5.5" fill="#F08A7E"/><circle cx="66" cy="78" r="5.5" fill="#F3B552"/><circle cx="84" cy="78" r="5.5" fill="#6CC79A"/>
    <text x="352" y="83" fill="#A8A9B0" font-size="12" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace">prompt.md</text>
    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="13.5">
      <text x="46" y="130"><tspan fill="#6AA6E3">&lt;role&gt;</tspan><tspan fill="#F4F1EA"> senior analyst</tspan></text>
      <text x="46" y="160"><tspan fill="#F3B552">&lt;task&gt;</tspan><tspan fill="#F4F1EA"> summarize report</tspan></text>
      <text x="46" y="190"><tspan fill="#9FC3EA">&lt;context&gt;</tspan><tspan fill="#F4F1EA"> for the board</tspan></text>
      <text x="46" y="220"><tspan fill="#F3B552">{{report}}</tspan></text>
      <text x="46" y="250"><tspan fill="#6CC79A">&lt;format&gt;</tspan><tspan fill="#F4F1EA"> 5 bullets</tspan></text>
    </g>
    <rect x="46" y="264" width="9" height="17" rx="2" fill="#F3B552">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Flow into the model -->
  <path d="M374 178 C 410 178, 405 236, 412 240" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9">
    <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Model orb -->
  <circle cx="478" cy="240" r="112" fill="none" stroke="#F3B552" stroke-opacity=".22" stroke-dasharray="3 7"/>
  <circle cx="478" cy="240" r="88" fill="none" stroke="#6AA6E3" stroke-opacity=".28"/>
  <circle cx="478" cy="240" r="66" fill="url(#orb)" filter="url(#blur)" opacity=".7"/>
  <circle cx="478" cy="240" r="62" fill="url(#orb)"/>
  <circle cx="478" cy="240" r="62" fill="url(#orbShine)"/>
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6" fill="none">
    <path d="M452 226 L472 214 L492 226 L504 248 M472 214 L478 244 L452 226 M478 244 L504 248 M478 244 L462 264 L492 266 L504 248"/>
  </g>
  <g fill="#ffffff"><circle cx="452" cy="226" r="3.5"/><circle cx="472" cy="214" r="3.5"/><circle cx="492" cy="226" r="3.5"/><circle cx="504" cy="248" r="3.5"/><circle cx="478" cy="244" r="4"/><circle cx="462" cy="264" r="3.5"/><circle cx="492" cy="266" r="3.5"/></g>
  <circle cx="566" cy="240" r="5" fill="#6AA6E3"><animateTransform attributeName="transform" type="rotate" from="0 478 240" to="360 478 240" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="478" cy="128" r="4" fill="#F3B552"><animateTransform attributeName="transform" type="rotate" from="0 478 240" to="-360 478 240" dur="14s" repeatCount="indefinite"/></circle>
  <text x="478" y="338" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">LANGUAGE MODEL</text>

  <!-- Output card -->
  <path d="M478 346 L478 372" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#shadow)">
    <rect x="340" y="378" width="276" height="122" rx="18" fill="#22252D" fill-opacity=".96" stroke="#6CC79A" stroke-opacity=".5" stroke-width="1.5"/>
    <circle cx="368" cy="406" r="11" fill="#6CC79A"/>
    <path d="M362.5 406 l4 4 l7 -8" stroke="#17191F" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="388" y="411" fill="#F4F1EA" font-size="14" font-weight="700">Reliable answer</text>
    <text x="598" y="411" fill="#6CC79A" font-size="11.5" font-weight="700" text-anchor="end">98% pass</text>
    <g fill="#6CC79A"><circle cx="364" cy="437" r="3"/><circle cx="364" cy="459" r="3"/><circle cx="364" cy="481" r="3"/></g>
    <rect x="376" y="433" width="196" height="8" rx="4" fill="#A8A9B0" fill-opacity=".45"/>
    <rect x="376" y="455" width="164" height="8" rx="4" fill="#A8A9B0" fill-opacity=".35"/>
    <rect x="376" y="477" width="182" height="8" rx="4" fill="#A8A9B0" fill-opacity=".25"/>
  </g>

  <!-- Technique chips -->
  <g font-size="13" font-weight="600" fill="#F4F1EA">
    <rect x="24" y="326" width="112" height="34" rx="17" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".5"/>
    <text x="80" y="348" text-anchor="middle">Few-shot</text>
    <rect x="146" y="326" width="164" height="34" rx="17" fill="#22252D" stroke="#F3B552" stroke-opacity=".5"/>
    <text x="228" y="348" text-anchor="middle">Chain-of-thought</text>
    <rect x="24" y="370" width="78" height="34" rx="17" fill="#22252D" stroke="#407EBF" stroke-opacity=".5"/>
    <text x="63" y="392" text-anchor="middle">RAG</text>
    <rect x="112" y="370" width="96" height="34" rx="17" fill="#22252D" stroke="#9FC3EA" stroke-opacity=".5"/>
    <text x="160" y="392" text-anchor="middle">Agents</text>
    <rect x="218" y="370" width="92" height="34" rx="17" fill="#22252D" stroke="#E5A33F" stroke-opacity=".5"/>
    <text x="264" y="392" text-anchor="middle">Evals</text>
    <rect x="24" y="414" width="116" height="34" rx="17" fill="#22252D" stroke="#6CC79A" stroke-opacity=".5"/>
    <text x="82" y="436" text-anchor="middle">Security</text>
    <rect x="150" y="414" width="160" height="34" rx="17" fill="#22252D" stroke="#F3B552" stroke-opacity=".5"/>
    <text x="230" y="436" text-anchor="middle">Production</text>
  </g>

  <!-- Sparkles -->
  <g fill="#F3B552">
    <path d="M598 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" opacity=".85"/>
    <path d="M410 40 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".6"/>
    <path d="M612 318 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".55"/>
    <path d="M318 478 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".45"/>
  </g>
</svg>