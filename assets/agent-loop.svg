<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The agent loop: think, act with a tool, observe, decide; with guardrails</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <radialGradient id="g1" cx=".35" cy=".55" r=".55"><stop offset="0" stop-color="#F3B552" stop-opacity=".25"/><stop offset="1" stop-color="#F3B552" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6AA6E3"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#407EBF"/><stop offset=".5" stop-color="#6AA6E3"/><stop offset="1" stop-color="#F3B552"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F3B552"/></marker>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="960" height="440" rx="22" fill="#17191F"/>
  <rect width="960" height="440" rx="22" fill="url(#dots)"/>
  <rect width="960" height="440" rx="22" fill="url(#g1)"/>

  <text x="36" y="48" fill="#F4F1EA" font-size="24" font-weight="800" letter-spacing="-.4">The Agent Loop</text>
  <text x="36" y="70" fill="#A8A9B0" font-size="13.5">Think → act → observe → decide, repeated until the goal is met.</text>

  <!-- Ring -->
  <circle cx="330" cy="250" r="140" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="4 8" opacity=".8"/>
  <g fill="none" stroke="#F3B552" stroke-width="3" marker-end="url(#a)">
    <path d="M414.3 138.2 A140 140 0 0 1 441.8 165.7"/>
    <path d="M441.8 334.3 A140 140 0 0 1 414.3 361.8"/>
    <path d="M245.7 361.8 A140 140 0 0 1 218.2 334.3"/>
    <path d="M218.2 165.7 A140 140 0 0 1 245.7 138.2"/>
  </g>

  <!-- Center -->
  <circle cx="330" cy="250" r="64" fill="url(#orb)" opacity=".3"/>
  <circle cx="330" cy="250" r="56" fill="url(#orb)"/>
  <text x="330" y="246" fill="#17191F" font-size="22" text-anchor="middle">🤖</text>
  <text x="330" y="270" fill="#17191F" font-size="13" font-weight="800" text-anchor="middle">Agent</text>

  <!-- Nodes -->
  <g filter="url(#sh)">
    <rect x="250" y="76" width="160" height="62" rx="14" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".55"/>
    <rect x="400" y="219" width="160" height="62" rx="14" fill="#22252D" stroke="#F3B552" stroke-opacity=".55"/>
    <rect x="250" y="362" width="160" height="62" rx="14" fill="#22252D" stroke="#E5A33F" stroke-opacity=".55"/>
    <rect x="100" y="219" width="160" height="62" rx="14" fill="#22252D" stroke="#6CC79A" stroke-opacity=".55"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#F4F1EA">
    <text x="330" y="102">🧠 Think / plan</text>
    <text x="480" y="245">🛠️ Act</text>
    <text x="330" y="388">👀 Observe</text>
    <text x="180" y="245">✅ Done?</text>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="330" y="122" fill="#9FC3EA">“I need the weather first”</text>
    <text x="480" y="265" fill="#F3B552" font-family="'JetBrains Mono', Menlo, monospace" font-size="11">get_weather("Pune")</text>
    <text x="330" y="408" fill="#E5A33F" font-family="'JetBrains Mono', Menlo, monospace" font-size="11">{"temp": 31, "rain": 0.1}</text>
    <text x="180" y="265" fill="#6CC79A">answer, or loop again</text>
  </g>

  <!-- Guardrails -->
  <g filter="url(#sh)"><rect x="624" y="92" width="300" height="324" rx="18" fill="#22252D" stroke="#6CC79A" stroke-opacity=".45"/></g>
  <text x="648" y="128" fill="#6CC79A" font-size="12" font-weight="800" letter-spacing="1.3">GUARDRAILS</text>
  <text x="648" y="152" fill="#F4F1EA" font-size="17" font-weight="800">Keep the loop safe</text>
  <g font-size="13.5" fill="#F4F1EA">
    <rect x="648" y="172" width="252" height="40" rx="10" fill="#17191F" stroke="#393D47" stroke-opacity=".4"/><text x="664" y="197">⏱️  Max steps, time and budget</text>
    <rect x="648" y="218" width="252" height="40" rx="10" fill="#17191F" stroke="#393D47" stroke-opacity=".4"/><text x="664" y="243">🔐  Least-privilege tools</text>
    <rect x="648" y="264" width="252" height="40" rx="10" fill="#17191F" stroke="#393D47" stroke-opacity=".4"/><text x="664" y="289">🙋  Human approval for risky acts</text>
    <rect x="648" y="310" width="252" height="40" rx="10" fill="#17191F" stroke="#393D47" stroke-opacity=".4"/><text x="664" y="335">🧱  Tool output is data, not orders</text>
    <rect x="648" y="356" width="252" height="40" rx="10" fill="#17191F" stroke="#393D47" stroke-opacity=".4"/><text x="664" y="381">🧾  Log every step</text>
  </g>
</svg>