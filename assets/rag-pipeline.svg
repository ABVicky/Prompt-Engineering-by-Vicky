<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Retrieval-Augmented Generation: offline indexing and online answering</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity=".07"/></pattern>
    <radialGradient id="g1" cx=".9" cy=".1" r=".7"><stop offset="0" stop-color="#407EBF" stop-opacity=".3"/><stop offset="1" stop-color="#407EBF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".1" cy="1" r=".6"><stop offset="0" stop-color="#F3B552" stop-opacity=".2"/><stop offset="1" stop-color="#F3B552" stop-opacity="0"/></radialGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#407EBF"/><stop offset="1" stop-color="#6AA6E3"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8A9B0"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F3B552"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".4"/></filter>
  </defs>
  <rect width="960" height="420" rx="22" fill="#17191F"/>
  <rect width="960" height="420" rx="22" fill="url(#dots)"/>
  <rect width="960" height="420" rx="22" fill="url(#g1)"/>
  <rect width="960" height="420" rx="22" fill="url(#g2)"/>

  <text x="36" y="50" fill="#F4F1EA" font-size="24" font-weight="800" letter-spacing="-.4">Retrieval-Augmented Generation (RAG)</text>
  <text x="36" y="74" fill="#A8A9B0" font-size="13.5">Index your knowledge once, then retrieve only what each question needs.</text>

  <!-- Lane 1 -->
  <rect x="36" y="94" width="196" height="24" rx="12" fill="#6AA6E3" fill-opacity=".15"/>
  <text x="134" y="111" fill="#6AA6E3" font-size="11.5" font-weight="800" letter-spacing="1.2" text-anchor="middle">1 · INDEXING (OFFLINE)</text>
  <g filter="url(#sh)" font-size="14" text-anchor="middle">
    <rect x="36" y="132" width="170" height="80" rx="14" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".45"/>
    <rect x="236" y="132" width="170" height="80" rx="14" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".45"/>
    <rect x="436" y="132" width="170" height="80" rx="14" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".45"/>
  </g>
  <g text-anchor="middle">
    <text x="121" y="164" font-size="20">📚</text><text x="121" y="186" fill="#F4F1EA" font-size="14" font-weight="700">Documents</text><text x="121" y="203" fill="#A8A9B0" font-size="11.5">PDFs, wiki, database</text>
    <text x="321" y="164" font-size="20">✂️</text><text x="321" y="186" fill="#F4F1EA" font-size="14" font-weight="700">Chunk</text><text x="321" y="203" fill="#A8A9B0" font-size="11.5">200–800 tokens + overlap</text>
    <text x="521" y="164" font-size="20">🔢</text><text x="521" y="186" fill="#F4F1EA" font-size="14" font-weight="700">Embed</text><text x="521" y="203" fill="#A8A9B0" font-size="11.5">text → vectors</text>
  </g>
  <!-- Vector store cylinder -->
  <g filter="url(#sh)">
    <path d="M660 128 v76 a80 16 0 0 0 160 0 v-76" fill="url(#db)" fill-opacity=".85"/>
    <ellipse cx="740" cy="128" rx="80" ry="16" fill="#9FC3EA"/>
    <path d="M660 154 a80 16 0 0 0 160 0 M660 180 a80 16 0 0 0 160 0" fill="none" stroke="#ffffff" stroke-opacity=".3"/>
  </g>
  <text x="740" y="176" fill="#17191F" font-size="14" font-weight="800" text-anchor="middle">Vector store</text>
  <text x="740" y="196" fill="#17191F" font-size="11.5" text-anchor="middle">+ keyword index</text>
  <text x="866" y="160" fill="#A8A9B0" font-size="11.5">pgvector,</text><text x="866" y="176" fill="#A8A9B0" font-size="11.5">Chroma,</text><text x="866" y="192" fill="#A8A9B0" font-size="11.5">Qdrant…</text>
  <g stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)">
    <line x1="207" y1="172" x2="232" y2="172"/><line x1="407" y1="172" x2="432" y2="172"/><line x1="607" y1="172" x2="654" y2="172"/>
  </g>

  <!-- Retrieval link -->
  <path d="M740 222 L740 246 L281 246 L281 296" fill="none" stroke="#F3B552" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ab)"/>
  <rect x="436" y="234" width="150" height="24" rx="12" fill="#17191F" stroke="#F3B552" stroke-opacity=".5"/>
  <text x="511" y="250" fill="#F3B552" font-size="11.5" font-weight="600" text-anchor="middle">similarity search</text>

  <!-- Lane 2 -->
  <rect x="36" y="262" width="204" height="24" rx="12" fill="#F3B552" fill-opacity=".15"/>
  <text x="138" y="279" fill="#F3B552" font-size="11.5" font-weight="800" letter-spacing="1.2" text-anchor="middle">2 · ANSWERING (ONLINE)</text>
  <g filter="url(#sh)">
    <rect x="36" y="300" width="150" height="88" rx="14" fill="#22252D" stroke="#82B7EC" stroke-opacity=".5"/>
    <rect x="206" y="300" width="150" height="88" rx="14" fill="#22252D" stroke="#6AA6E3" stroke-opacity=".5"/>
    <rect x="376" y="300" width="150" height="88" rx="14" fill="#22252D" stroke="#E5A33F" stroke-opacity=".5"/>
    <rect x="546" y="300" width="150" height="88" rx="14" fill="#22252D" stroke="#F3B552" stroke-opacity=".5"/>
    <rect x="716" y="300" width="208" height="88" rx="14" fill="#1F2824" stroke="#6CC79A" stroke-opacity=".55"/>
  </g>
  <g text-anchor="middle">
    <text x="111" y="332" font-size="20">🙋</text><text x="111" y="354" fill="#F4F1EA" font-size="14" font-weight="700">Question</text><text x="111" y="372" fill="#A8A9B0" font-size="11.5">+ query rewrite</text>
    <text x="281" y="332" font-size="20">🔎</text><text x="281" y="354" fill="#F4F1EA" font-size="14" font-weight="700">Retrieve</text><text x="281" y="372" fill="#A8A9B0" font-size="11.5">top-k + rerank</text>
    <text x="451" y="332" font-size="20">🧩</text><text x="451" y="354" fill="#F4F1EA" font-size="14" font-weight="700">Grounded prompt</text><text x="451" y="372" fill="#A8A9B0" font-size="11.5">question + sources</text>
    <text x="621" y="332" font-size="20">🤖</text><text x="621" y="354" fill="#F4F1EA" font-size="14" font-weight="700">LLM</text><text x="621" y="372" fill="#A8A9B0" font-size="11.5">answers from sources</text>
    <text x="820" y="332" font-size="20">✅</text><text x="820" y="354" fill="#F4F1EA" font-size="14" font-weight="700">Answer + citations</text><text x="820" y="372" fill="#6CC79A" font-size="11.5">“…within 7 days [refund.md]”</text>
  </g>
  <g stroke="#A8A9B0" stroke-width="2" marker-end="url(#a)">
    <line x1="187" y1="344" x2="202" y2="344"/><line x1="357" y1="344" x2="372" y2="344"/><line x1="527" y1="344" x2="542" y2="344"/><line x1="697" y1="344" x2="712" y2="344"/>
  </g>
</svg>