<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Engineering: Zero to Pro</title>
<meta name="description" content="A complete prompt engineering course from beginner to professional, by Vicky Prasad Mahato (abvicky.in).">
<meta name="author" content="Vicky Prasad Mahato">
<meta name="theme-color" content="#F5F4F9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F3B552'/%3E%3Cpath d='M17 22h30M17 32h22M17 42h13' stroke='%2334363D' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="assets/reader/theme.css">
<link rel="stylesheet" href="assets/reader/content.css">
<link rel="stylesheet" href="assets/reader/pages.css">
<script>
  /* Apply saved preferences before first paint (no flash). */
  try {
    var t = localStorage.getItem("pe-theme"), s = localStorage.getItem("pe-size"), a = localStorage.getItem("pe-audience");
    var theme = t ? JSON.parse(t) : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#17191F" : "#F5F4F9");
    if (s) document.documentElement.setAttribute("data-size", JSON.parse(s));
    if (a) document.documentElement.setAttribute("data-audience", JSON.parse(a));
  } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="read-progress" aria-hidden="true"></div>

<header class="topbar">
  <button class="icon-btn only-mobile" id="menu-btn" aria-label="Open course navigation" data-icon="menu"></button>
  <a class="brand" href="#/" aria-label="Course home">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#F3B552"/><path d="M17 22h30M17 32h22M17 42h13" stroke="#34363D" stroke-width="5" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-text"><strong>Prompt Engineering</strong><small>Zero to Pro · by Vicky Prasad Mahato</small></span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="top-actions">
    <button class="search-trigger" id="search-btn" aria-label="Search the course">
      <span data-icon="search"></span><span class="st-label">Search the course</span><kbd class="st-kbd">⌘K</kbd>
    </button>
    <div class="lens-toggle hide-mobile" id="lens-toggle" role="group" aria-label="Audience track lens">
      <button type="button" class="lt-btn active" data-aud="all" title="View all content">🌟 All</button>
      <button type="button" class="lt-btn" data-aud="non-tech" title="Focus on Non-Tech & Business track">👔 Non-Tech</button>
      <button type="button" class="lt-btn" data-aud="tech" title="Focus on Developer & Tech track">💻 Tech</button>
    </div>
    <button class="icon-btn only-mobile" id="lens-btn" aria-label="Toggle audience track" title="Toggle track lens">🌟</button>
    <button class="icon-btn hide-mobile" id="size-btn" aria-label="Change text size" title="Text size" data-icon="type"></button>
    <button class="icon-btn hide-mobile" id="focus-btn" aria-label="Toggle focus mode" title="Focus mode" data-icon="focus"></button>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Light / dark"></button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Course navigation"></aside>
  <main id="main" tabindex="-1"><div id="view" class="view"><p class="loading">Loading course…</p></div></main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>
<div class="scrim" id="scrim" hidden></div>

<div class="palette" id="palette" hidden>
  <div class="palette-backdrop" data-close></div>
  <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Search the course">
    <label class="palette-input">
      <span data-icon="search"></span>
      <input id="pal-input" type="text" placeholder="Search modules, techniques, templates…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </label>
    <div class="palette-results" id="pal-results" role="listbox"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>←</kbd><kbd>→</kbd> prev / next page</span><span><kbd>/</kbd> search</span>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="icon-btn lightbox-close" data-close aria-label="Close" data-icon="x"></button>
  <div class="lightbox-stage" id="lightbox-stage" data-close></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="to-top" id="to-top" aria-label="Back to top" data-icon="arrowUp"></button>

<script src="course-data.js"></script>
<script src="assets/reader/course-map.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="assets/reader/enhance.js"></script>
<script src="assets/reader/core.js"></script>
</body>
</html>
